<div class="event-box">
    <div class="event-image">
      <img src="{{ include.event.image }}" alt="{{ include.event.title }}">
    </div>
  
    <div class="event-content">
      <h3>{{ include.event.title }}</h3>
      <p class="event-date">{{ include.event.date }}</p>
      <p>{{ include.event.description }}</p>
    </div>
  </div>
